[alembic]
# Путь к папке со скриптами миграций
script_location = alembic
prepend_sys_path = .

# URL подключения (будет перезаписан в alembic/env.py из .env файла, 
# но alembic требует, чтобы эта строка была здесь для валидации)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/twitter_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S